<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Tienda de Computadoras</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background-color: #0f172a; color: #f8fafc; }
    header { background: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    h1 { color: #38bdf8; margin: 0; font-size: 1.5rem; }
    .contenedor { display: flex; padding: 2rem; gap: 2rem; }
    .catalogo { flex: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
    .tarjeta-producto { background: #1e293b; border-radius: 8px; padding: 1rem; text-align: center; border: 1px solid #334155; }
    .tarjeta-producto img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; }
    .carrito-seccion { flex: 1; background: #1e293b; padding: 1.5rem; border-radius: 8px; height: fit-content; border: 1px solid #334155; }
    button { background-color: #0ea5e9; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 0.5rem; width: 100%; }
    button:hover { background-color: #0284c7; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; box-sizing: border-box; }
    ul { padding-left: 0; list-style: none; }
    li { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; border-bottom: 1px solid #334155; padding-bottom: 0.3rem; }
  </style>
</head>
<body>
  <header>
    <h1>TechStore 💻</h1>
    <span id="contadorCarrito">🛒 Carrito: 0 items</span>
  </header>
  <div class="contenedor">
    <div class="catalogo" id="catalogoProductos"></div>
    <div class="carrito-seccion">
      <h2>Tu Carrito</h2>
      <ul id="listaCarrito"></ul>
      <h3>Total: $<span id="totalCarrito">0.00</span></h3>
      <div style="margin-top: 1rem;">
        <input type="text" id="nombreCliente" placeholder="Tu Nombre" required>
        <input type="email" id="emailCliente" placeholder="Tu Correo" required>
        <button id="botonComprar">Finalizar Compra y Registrar</button>
      </div>
      <p id="mensajeEstado" style="text-align: center; margin-top: 1rem;"></p>
    </div>
  </div>
  <script src="TiendaCliente.js"></script>
  <script src="app.js"></script>
</body>
</html>
